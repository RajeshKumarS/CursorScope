[package]
name = "cursorscope-desktop"
version = "0.2.0"
description = "CursorScope desktop shell"
authors = ["CursorScope"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
